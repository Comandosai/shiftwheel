name: Build ShiftWheel (macOS arm64 + Windows x64, unsigned)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/restore_assets.py
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libegl1 libxkbcommon0
          pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  macos:
    runs-on: macos-14   # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore binary assets
        run: python scripts/restore_assets.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          brew install ffmpeg   # only for tests; NOT bundled into the app

      - name: Run tests (incl. real ffmpeg conversions)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build ShiftWheel.app
        run: pyinstaller ShiftWheel.spec --noconfirm

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          file dist/ShiftWheel.app/Contents/MacOS/ShiftWheel
          dist/ShiftWheel.app/Contents/MacOS/ShiftWheel --selftest

      - name: Ad-hoc sign (no Apple ID needed)
        run: codesign --force --deep --sign - dist/ShiftWheel.app

      - name: Build DMG + zip
        run: |
          mkdir -p dmg && cp -R dist/ShiftWheel.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname ShiftWheel -srcfolder dmg -ov -format UDZO dist/ShiftWheel-arm64.dmg
          ditto -c -k --keepParent dist/ShiftWheel.app dist/ShiftWheel-arm64.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftWheel-macos-arm64
          path: |
            dist/ShiftWheel-arm64.dmg
            dist/ShiftWheel-arm64.app.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore binary assets
        run: python scripts/restore_assets.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          choco install ffmpeg -y --no-progress   # only for tests; NOT bundled

      - name: Run tests (incl. real ffmpeg conversions)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build ShiftWheel (folder)
        run: pyinstaller ShiftWheel.spec --noconfirm

      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\ShiftWheel\ShiftWheel.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed ($($p.ExitCode))" }
          "Self-test passed"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\ShiftWheel -DestinationPath dist\ShiftWheel-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftWheel-windows-x64
          path: dist/ShiftWheel-windows-x64.zip
