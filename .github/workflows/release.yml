name: Release

# Creates tag v<VERSION> + GitHub Release with ready binaries whenever VERSION changes on main
# (or manually via "Run workflow"). Source zip/tar.gz are added by GitHub automatically.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/restore_assets.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          brew install ffmpeg
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller ShiftWheel.spec --noconfirm
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/ShiftWheel.app/Contents/MacOS/ShiftWheel --selftest
      - run: codesign --force --deep --sign - dist/ShiftWheel.app
      - name: DMG + zip
        run: |
          mkdir -p dmg && cp -R dist/ShiftWheel.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname ShiftWheel -srcfolder dmg -ov -format UDZO dist/ShiftWheel-arm64.dmg
          ditto -c -k --keepParent dist/ShiftWheel.app dist/ShiftWheel-arm64.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/ShiftWheel-arm64.dmg
            dist/ShiftWheel-arm64.app.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/restore_assets.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          choco install ffmpeg -y --no-progress
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller ShiftWheel.spec --noconfirm
      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\ShiftWheel\ShiftWheel.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed ($($p.ExitCode))" }
      - shell: pwsh
        run: Compress-Archive -Path dist\ShiftWheel -DestinationPath dist\ShiftWheel-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ShiftWheel-windows-x64.zip

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d ' \n\r' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ShiftWheel v${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            out/ShiftWheel-arm64.dmg
            out/ShiftWheel-arm64.app.zip
            out/ShiftWheel-windows-x64.zip
